apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
android {
	compileSdkVersion 29
	buildToolsVersion "29.0.2"


	defaultConfig {
		minSdkVersion 21
		targetSdkVersion 29
		versionCode 1
		versionName "1.0"

		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
		consumerProguardFiles 'consumer-rules.pro'
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}

}

dependencies {
	implementation project(":component.design")

	implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
	implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.2.0-rc03'
	implementation 'androidx.appcompat:appcompat:1.1.0'
	implementation 'androidx.core:core-ktx:1.1.0'
	implementation 'com.vk:androidsdk:1.6.5'
	implementation 'com.google.firebase:firebase-database:16.0.1'
	implementation 'com.google.firebase:firebase-auth:16.0.2'
	implementation 'ru.endroad.camp:fragment-navigation:1.0.0'
	implementation 'ru.endroad:arena:2.3.0'

	implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.0'
	implementation 'org.koin:koin-core:2.0.0-rc-2'
	implementation 'org.koin:koin-core-ext:2.0.0-rc-2'
	implementation 'org.koin:koin-androidx-viewmodel:2.0.0-rc-2'
}
