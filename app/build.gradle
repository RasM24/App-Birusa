apply plugin: 'com.google.gms.google-services'

android {

	signingConfigs {
		mainConfig {
			keyAlias birusaKeyAlias
			keyPassword birusaKeyPassword
			storeFile file(birusaStorePath)
			storePassword birusaStorePassword
		}
	}

	defaultConfig {
		applicationId "endroad.birusa"
		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
		vectorDrawables.useSupportLibrary = true
	}
	buildTypes {
		release {signingConfig signingConfigs.mainConfig}
		debug {signingConfig signingConfigs.mainConfig		}
	}
}

dependencies {
	implementation project(":feature.navigation-main")
	implementation project(":feature.auth")
	implementation project(":feature.chat")
	implementation project(":component.design")

	//KOIN
	implementation'org.koin:koin-core:2.0.0'
	implementation'org.koin:koin-core-ext:2.0.0'
	implementation'org.koin:koin-androidx-viewmodel:2.0.0'

	//Core extension
	implementation'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.0'

	//GoogleServices
	implementation 'com.google.android.gms:play-services-maps:17.0.0'
	implementation 'com.firebaseui:firebase-ui-database:1.2.0'
	implementation 'com.google.firebase:firebase-core:17.2.1'
	implementation 'com.google.firebase:firebase-messaging:20.1.0'
	implementation 'com.google.android.gms:play-services-auth:17.0.0'
	implementation 'com.google.maps.android:android-maps-utils:0.4.4'

	//Utils
	implementation 'com.squareup.picasso:picasso:2.5.2'
	implementation 'androidx.vectordrawable:vectordrawable:1.1.0'

}