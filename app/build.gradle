apply plugin: 'com.android.application'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-android'

android {

	signingConfigs {
		mainConfig {
			keyAlias birusaKeyAlias
			keyPassword birusaKeyPassword
			storeFile file(birusaStorePath)
			storePassword birusaStorePassword
		}
	}

	compileSdkVersion 29
	defaultConfig {
		applicationId "endroad.birusa"
		minSdkVersion 21
		targetSdkVersion 29
		versionCode 8
		versionName "0.3beta"
		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
		vectorDrawables.useSupportLibrary = true
	}
	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
			signingConfig signingConfigs.mainConfig
		}
		debug {
			signingConfig signingConfigs.mainConfig
		}
	}

}

dependencies {
	implementation 'com.google.android.gms:play-services-maps:15.0.1'
	implementation 'com.firebaseui:firebase-ui-database:1.2.0'
	implementation 'androidx.appcompat:appcompat:1.0.0'
	implementation 'com.google.android.material:material:1.0.0'
	implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
	implementation 'androidx.vectordrawable:vectordrawable:1.0.0'
	implementation 'com.google.firebase:firebase-database:16.0.1'
	implementation 'com.google.firebase:firebase-core:16.0.1'
	implementation 'com.google.firebase:firebase-auth:16.0.2'
	implementation 'com.google.firebase:firebase-messaging:17.1.0'
	implementation 'com.google.android.gms:play-services-auth:15.0.1'
	implementation 'androidx.cardview:cardview:1.0.0'
	implementation 'com.squareup.picasso:picasso:2.5.2'
	implementation 'com.vk:androidsdk:1.6.5'
	implementation 'com.google.maps.android:android-maps-utils:0.4.4'
	implementation "androidx.core:core-ktx:+"
	implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
	implementation "ru.endroad.camp:fragment-navigation:1.0.0"
	implementation "ru.endroad:arena:2.2.0"
}

apply plugin: 'com.google.gms.google-services'
repositories {
	mavenCentral()
	mavenLocal()
}